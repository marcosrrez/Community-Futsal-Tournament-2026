<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Live scores, standings, and bracket — Community Futsal Tournament 2026." />
    <title>Futsal 2026</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>

    <header class="header">
      <div>
        <p class="event-tag">Futsal Tournament 2026</p>
        <h1 class="event-title">Game Day</h1>
      </div>
      <div class="header-right">
        <button id="resetBtn" class="btn-reset hidden">Reset</button>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="App sections">
      <button class="tab active" data-tab="schedule" role="tab">Schedule</button>
      <button class="tab"        data-tab="standings" role="tab">Standings</button>
      <button class="tab"        data-tab="bracket"   role="tab">Bracket</button>
      <button class="tab hidden" data-tab="ops"       role="tab" id="adminTab">Admin</button>
    </nav>

    <main>

      <!-- ── SCHEDULE ─────────────────────────── -->
      <section id="schedule" class="tab-panel active" role="tabpanel">
        <div id="teamBanner"></div>
        <div id="myNextMatch"></div>
        <div id="scheduleView"></div>
      </section>

      <!-- ── STANDINGS ────────────────────────── -->
      <section id="standings" class="tab-panel" role="tabpanel">
        <p class="standings-intro">Top 2 from each group advance to the quarterfinals.</p>
        <div id="standingsContainer" class="groups-grid"></div>
      </section>

      <!-- ── BRACKET ──────────────────────────── -->
      <section id="bracket" class="tab-panel" role="tabpanel">
        <p class="bracket-intro">Fills in as the group stage is completed.</p>
        <div id="bracketView"></div>
      </section>

      <!-- ── ADMIN (hidden unless ?admin) ─────── -->
      <section id="ops" class="tab-panel" role="tabpanel">

        <details class="admin-sync">
          <summary>Cloud Sync (Supabase)</summary>
          <div class="sync-body">
            <div class="sync-fields">
              <label class="field-label">Supabase URL
                <input id="sbUrl" type="text" placeholder="https://….supabase.co" autocomplete="off" />
              </label>
              <label class="field-label">Anon Key
                <input id="sbKey" type="password" placeholder="eyJ…" autocomplete="off" />
              </label>
              <label class="field-label">Room ID
                <input id="sbRoom" type="text" placeholder="futsal-2026" autocomplete="off" />
              </label>
            </div>
            <div class="sync-row">
              <button id="connectSyncBtn"    class="btn primary sm">Connect</button>
              <button id="disconnectSyncBtn" class="btn sm">Disconnect</button>
              <button id="pullSyncBtn"       class="btn sm">Pull</button>
              <button id="pushSyncBtn"       class="btn sm">Push</button>
              <span id="syncStatus">Not connected</span>
            </div>
          </div>
        </details>

        <div class="admin-section">
          <h2 class="admin-section-title">Group Stage</h2>
          <div id="groupMatchesAdmin" class="admin-list"></div>
        </div>

        <div class="admin-section">
          <h2 class="admin-section-title">Knockout Stage</h2>
          <div id="knockoutAdmin" class="admin-list"></div>
        </div>

      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
